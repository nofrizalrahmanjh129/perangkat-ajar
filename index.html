<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perangkat Ajar</title>
<style>
:root{--p:#1d4ed8;--bg:#f5f7fb;--line:#d7dce5;--ink:#1f2937}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--p);color:#fff;padding:12px 18px}
header h1{margin:0;font-size:18px}
.wrap{display:flex;min-height:calc(100vh - 50px)}
nav{width:250px;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:8px;position:sticky;top:0;height:calc(100vh - 50px)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink)}
nav button.on,nav button:hover{background:#e8efff;color:var(--p);font-weight:600}
main{flex:1;padding:18px;overflow:auto;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:4px;vertical-align:top}
th{background:#eef2f8;text-align:left;font-size:12px}
input,select,textarea{width:100%;padding:5px;border:1px solid #c5ccd8;border-radius:5px;font:inherit;background:#fff}
textarea{min-height:60px;resize:vertical}
.hd select{width:auto;padding:2px}
.pv{display:none}
.btn{background:var(--p);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;margin:4px 4px 4px 0;font:inherit}
.btn.g{background:#0f766e}
.btn.xl{background:#15803d}
.btn.dx{background:#7c3aed}
.btn.pdf{background:#334155}
.btn:hover{filter:brightness(.92)}
.btn.r{background:#dc2626;padding:3px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label,label.f{display:block;font-size:12px;color:#555;margin-bottom:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:10px}
.hint{color:#6b7280;font-size:12px}
.kop{text-align:center;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:12px}
.sig{display:flex;justify-content:space-between;margin-top:40px;text-align:center}
.sig div{width:40%}
.cover{min-height:700px;text-align:center;padding:60px 30px}
@media print{
  nav,header,.noprint,.toolbar{display:none!important}
  .wrap{display:block}main{padding:0}
  .card{border:0;padding:0;margin:0 0 10px}
  body{background:#fff}
  input,select,textarea{border:0;background:none;padding:0}
  input[type=date]{display:none!important}
  .pv{display:inline!important}
  select{-webkit-appearance:none;appearance:none}
  th,td{font-size:11px}
}
@media(max-width:800px){
  .wrap{flex-direction:column}
  nav{width:auto;height:auto;position:static;display:flex;overflow-x:auto;white-space:nowrap}
  nav button{width:auto}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header><h1>Perangkat Ajar — Mata Pelajaran Umum &amp; Produktif</h1></header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
const KEY='perangkatAjar.v2';
const CLASSES=['XI TJKT 1','XI TJKT 2','XII TJKT 1','XII TJKT 2','XII TJKT 3'];
let STORE={active:CLASSES[0],profiles:{}};
let DB={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(STORE))}catch(e){}}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const ID=()=>DB.id||{};
const kv=c=>(DB.kv||{})[c]||'';
const kkm=()=>+ID().kkmTuntas||87;
const batasKompeten=()=>+ID().batasKompeten||95;
const BULAN=['Juli','Agustus','September','Oktober','November','Desember','Januari','Februari','Maret','April','Mei','Juni'];
const BLN_S=['Jul','Agu','Sep','Okt','Nov','Des','Jan','Feb','Mar','Apr','Mei','Jun'];
const SK=['','SB','B','C','K'];
const TABLES={};

const ID_FIELDS=[
 ['sekolah','Nama Sekolah'],['alamat','Alamat Sekolah'],['kepsek','Nama Kepala Sekolah'],['nipKepsek','NIP Kepala Sekolah'],
 ['guru','Nama Guru'],['nip','NIP Guru'],['mapel','Mata Pelajaran'],['kelas','Kelas (contoh: X / XI / XII)'],
 ['konsentrasi','Konsentrasi Keahlian / Program'],['semester','Semester (Ganjil / Genap)'],['tahun','Tahun Ajaran (contoh: 2026/2027)'],
 ['wali','Nama Wali Kelas'],['kkmTuntas','Batas nilai tuntas (di bawah ini = tidak tuntas)'],['batasKompeten','Batas nilai kompeten']
];

/* ---------- helpers: sel & cell ---------- */
function cell(key,i,c,r){
  const v=(r||{})[c.k]??'';
  const a=`data-k="${key}" data-i="${i}" data-c="${c.k}"`;
  if(c.t==='sel') return `<select ${a}>${c.o.map(o=>`<option${o===String(v)?' selected':''}>${o}</option>`).join('')}</select>`;
  if(c.t==='ta') return `<textarea ${a}>${esc(v)}</textarea>`;
  const type=c.t==='n'?'number':c.t==='d'?'date':'text';
  return `<input ${a} type="${type}" value="${esc(v)}">`;
}

/* ---------- generic table & cards ---------- */
function tbl(key,cols,o={}){
  const blank=o.blank||{};
  TABLES[key]={blank,cols};
  if(!DB[key]) DB[key]=clone(o.init||[blank]);
  const rows=DB[key];
  return `<div class="card">
  <div class="toolbar noprint"><button class="btn" data-act="add" data-k="${key}">+ Tambah baris</button><button class="btn xl" title="Unduh tabel ini sebagai Excel" onclick="xlTable('${key}')">⬇ Excel</button><button class="btn dx" title="Unduh tabel ini sebagai Word" onclick="ex('word','${key}')">⬇ Word</button><button class="btn pdf" title="Unduh tabel ini sebagai PDF" onclick="ex('pdf','${key}')">⬇ PDF</button><button class="btn g" title="Buka dialog cetak" onclick="window.print()">🖨 Cetak</button></div>
  ${o.note?`<p class="hint noprint">${o.note}</p>`:''}
  <div style="overflow:auto"><table><thead><tr><th style="width:34px">No</th>${cols.map(c=>`<th>${c.l}</th>`).join('')}<th class="noprint" style="width:40px"></th></tr></thead>
  <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td>${cols.map(c=>`<td>${cell(key,i,c,r)}</td>`).join('')}<td class="noprint"><button class="btn r" data-act="del" data-k="${key}" data-i="${i}">×</button></td></tr>`).join('')}</tbody></table></div>
  </div>`;
}
function cards(key,title,fields,o={}){
  TABLES[key]={blank:o.blank||{},fields};
  if(!DB[key]) DB[key]=[];
  const items=DB[key];
  const head=`<div class="toolbar noprint"><button class="btn" data-act="add" data-k="${key}">+ Tambah ${title}</button><button class="btn g" onclick="window.print()">Cetak</button></div>`;
  const body=items.map((it,i)=>`<div class="card">
    <div class="toolbar noprint"><b>${title} ${i+1}</b><span style="flex:1"></span><button class="btn dx" title="Unduh modul ini sebagai Word" onclick="docxItem('${key}',${i})">⬇ Word</button><button class="btn pdf" title="Unduh modul ini sebagai PDF" onclick="pdfItem('${key}',${i})">⬇ PDF</button><button class="btn r" data-act="del" data-k="${key}" data-i="${i}">Hapus</button></div>
    ${fields.map(([c,l,t])=>`<label class="f" style="display:block;margin:8px 0"><b>${l}</b>${cell(key,i,{k:c,t:t||'ta'},it)}</label>`).join('')}
  </div>`).join('');
  return head+(body||`<p class="hint">Belum ada isi. Klik "Tambah".</p>`);
}

/* ---------- print wrapper ---------- */
function kop(t){
  const I=ID();
  return `<div class="kop"><b>${esc(I.sekolah||'NAMA SEKOLAH')}</b><br><small>${esc(I.alamat||'')}</small>
  <h2 style="margin:8px 0 0">${esc(t)}</h2>
  <small>${esc(I.mapel||'Mata Pelajaran')} · Kelas ${esc(I.kelas||'-')} · Semester ${esc(I.semester||'-')} · TA ${esc(I.tahun||'-')}</small></div>`;
}
function sig(){
  const I=ID();
  return `<div class="sig"><div>Mengetahui,<br>Kepala Sekolah<br><br><br><b>${esc(I.kepsek||'................')}</b><br>NIP. ${esc(I.nipKepsek||'................')}</div>
  <div>Guru Mata Pelajaran<br><br><br><br><b>${esc(I.guru||'................')}</b><br>NIP. ${esc(I.nip||'................')}</div></div>`;
}
function P(title,body,withSig=true){return kop(title)+body+(withSig?sig():'')}

/* ---------- calc: rata, predikat, kehadiran ---------- */
function rata(i){
  const c=comps(i);let s=0,wt=0;
  Object.keys(WEIGHTS).forEach(k=>{if(c[k]!==null&&c[k]!==undefined){s+=c[k]*WEIGHTS[k];wt+=WEIGHTS[k]}});
  return wt?(s/wt).toFixed(1):'';
}
function predikat(avg){
  if(avg==='') return '';
  const a=+avg;
  const rows=(DB.kktp||[]).map(r=>({min:parseFloat(r.min),pr:r.predikat})).filter(r=>!isNaN(r.min)).sort((x,y)=>y.min-x.min);
  const f=rows.find(r=>a>=r.min);
  return f?f.pr:'';
}
function kehadiran(i){
  let h=0,t=0;
  ((DB.hadirkls||{})[i]||[]).forEach(x=>{if(x){t++;if(x==='H')h++}});
  return t?Math.round(h/t*100):'';
}
const CALC={
  hrekap:(st,i)=>{
    const r=((DB[st]||{})[i])||[];const c={H:0,I:0,A:0,S:0,D:0};
    r.forEach(x=>{if(c[x]!==undefined)c[x]++});
    return `H${c.H} I${c.I} A${c.A} S${c.S} D${c.D}`;
  },
  pct:(st,i)=>{const v=kehadiran(i);return v===''?'':v+'%'},
  pp:(st,i)=>{const [p,kind]=st.split('|');const v=ppScore(+p,i,kind);return v===null?'':v.toFixed(0)},
  uhAvg:(st,i)=>{const u=uhList(i);return u.length?(u.reduce((a,b)=>a+b,0)/u.length).toFixed(1):''},
  rata:(st,i)=>rata(i),
  pred:(st,i)=>predikat(rata(i)),
  status:(st,i)=>{
    const a=rata(i);if(a==='') return '';
    const v=+a;
    if(v>=batasKompeten()) return 'Kompeten';
    if(v>=kkm()) return 'Tuntas';
    return 'Tidak tuntas';
  }
};
function refreshCalc(){
  document.querySelectorAll('[data-calc]').forEach(el=>{
    el.textContent=CALC[el.dataset.calc](el.dataset.st||'',+el.dataset.i);
  });
}

/* ---------- hadir grid ---------- */
function hadirGrid(store,n,head,extraHead=''){
  const S=DB.siswa||[];
  if(!S.length) return `<div class="card hint">Isi Data Siswa dulu di menu 16. Data Nilai.</div>`;
  const g=DB[store]||{};
  const days=Array.from({length:n},(_,d)=>d);
  return `<div class="card"><div style="overflow:auto"><table>
  <thead>${extraHead}<tr><th>No</th><th>Nama Siswa</th>${days.map(d=>`<th>${head}${d+1}</th>`).join('')}<th>Rekap</th></tr></thead>
  <tbody>${S.map((s,i)=>`<tr><td>${i+1}</td><td style="white-space:nowrap">${esc(s.nama)}</td>
  ${days.map(d=>{const v=(g[i]||[])[d]||'';return `<td class="hd"><select data-k="${store}" data-i="${i}" data-d="${d}">${['','H','I','A','S','D'].map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('')}</select></td>`}).join('')}
  <td data-calc="hrekap" data-st="${store}" data-i="${i}">${CALC.hrekap(store,i)}</td></tr>`).join('')}</tbody></table></div>
  <p class="hint">Keterangan: H = Hadir, I = Izin, A = Alfa, S = Sakit, D = Dispensasi</p></div>`;
}

/* ---------- pages ---------- */
function pgId(){
  return `<div class="card"><h2>Identitas &amp; Pengaturan</h2><div class="grid2">
  ${ID_FIELDS.map(([k,l])=>`<label>${l}<input data-k="id" data-c="${k}" value="${esc(ID()[k])}"></label>`).join('')}
  </div>
  <p class="hint">Data di sini otomatis dipakai di semua halaman. Tersimpan di browser perangkat ini.</p>
  <div class="toolbar"><button class="btn" onclick="expo()">Ekspor data (.json)</button>
  <label class="btn g" style="cursor:pointer">Impor data<input type="file" accept=".json" onchange="impo(this)" style="display:none"></label></div>
  </div>`;
}
function pgCover(){
  const I=ID();
  return `<div class="card cover">
  <p>PERANGKAT PEMBELAJARAN</p>
  <h1>${esc(I.mapel||'MATA PELAJARAN')}</h1>
  <p>Kelas ${esc(I.kelas||'-')} ${I.konsentrasi?'— '+esc(I.konsentrasi):''}</p>
  <p>Semester ${esc(I.semester||'-')} · Tahun Ajaran ${esc(I.tahun||'-')}</p>
  <br><br><b>${esc(I.sekolah||'NAMA SEKOLAH')}</b><p>${esc(I.alamat||'')}</p>
  <br><br><p>Nama Guru: ${esc(I.guru||'-')}<br>NIP: ${esc(I.nip||'-')}</p>
  </div>`;
}
function pgATP(){
  const cols=[{k:'elemen',l:'Elemen',t:'ta'},{k:'cp',l:'Capaian Pembelajaran',t:'ta'},{k:'tp',l:'Tujuan Pembelajaran',t:'ta'},{k:'materi',l:'Alur / Materi',t:'ta'},{k:'jp',l:'JP',t:'n'},{k:'sem',l:'Semester',t:'sel',o:['','1','2']}];
  return P('Alur Tujuan Pembelajaran (ATP)', tbl('atp',cols,{blank:{},note:'Isi berurutan sesuai alur pembelajaran. Tujuan pembelajaran disusun dari CP fase/kelas.'}));
}
function pgCPTP(){
  const cols=[{k:'elemen',l:'Elemen',t:'ta'},{k:'cp',l:'Capaian Pembelajaran (CP)',t:'ta'},{k:'tp',l:'Tujuan Pembelajaran (TP)',t:'ta'},{k:'kk',l:'Kata Kerja Operasional',t:'tx'},{k:'materi',l:'Materi Pokok',t:'ta'},{k:'indikator',l:'Indikator Ketercapaian',t:'ta'}];
  return P('Analisis CP — TP', tbl('cptp',cols,{blank:{}}));
}
function pgProta(){
  const cols=[{k:'materi',l:'Bab / Materi',t:'ta'},{k:'jp',l:'JP',t:'n'}].concat(BLN_S.map((b,i)=>({k:'b'+i,l:b,t:'sel',o:['','✓']})));
  return P('Program Tahunan (Prota)', tbl('prota',cols,{blank:{}}));
}
function pgPromes(){
  const cols=[{k:'pekan',l:'Pekan',t:'n'},{k:'tgl',l:'Tanggal',t:'d'},{k:'materi',l:'Materi / Topik',t:'ta'},{k:'tp',l:'Tujuan Singkat',t:'ta'},{k:'jp',l:'JP',t:'n'},{k:'ket',l:'Keterangan',t:'tx'}];
  return P('Program Semester (Promes)', tbl('promes',cols,{blank:{}}));
}
function pgKKTP(){
  const cols=[{k:'min',l:'Nilai Minimal',t:'n'},{k:'predikat',l:'Predikat',t:'tx'},{k:'desc',l:'Deskripsi Capaian',t:'ta'}];
  const init=[
    {min:90,predikat:'A (Sangat Baik)',desc:'Menguasai seluruh tujuan pembelajaran dengan sangat baik dan mandiri.'},
    {min:80,predikat:'B (Baik)',desc:'Menguasai sebagian besar tujuan pembelajaran dengan baik.'},
    {min:70,predikat:'C (Cukup)',desc:'Menguasai tujuan pembelajaran dasar, perlu sedikit penguatan.'},
    {min:0,predikat:'D (Perlu Bimbingan)',desc:'Belum menguasai tujuan pembelajaran, perlu bimbingan dan remedial.'}
  ];
  return P('Kriteria Ketercapaian Tujuan Pembelajaran (KKTP)', tbl('kktp',cols,{blank:{min:0,predikat:'',desc:''},init}));
}
function pgJurnal(){
  const cols=[{k:'tgl',l:'Tanggal',t:'d'},{k:'kelas',l:'Kelas',t:'tx'},{k:'materi',l:'Materi',t:'ta'},{k:'kegiatan',l:'Kegiatan Pembelajaran',t:'ta'},{k:'hadir',l:'Jumlah Hadir',t:'n'},{k:'refleksi',l:'Refleksi / Catatan',t:'ta'}];
  return P('Jurnal Mengajar Harian', tbl('jurnal',cols,{blank:{}}));
}
function pgModul(){
  const f=[['judul','Judul Bab / Modul','tx'],['alokasi','Alokasi Waktu','tx'],['tujuan','Tujuan Pembelajaran'],['pemahaman','Pemahaman Bermakna'],['pemantik','Pertanyaan Pemantik'],
  ['pembuka','Kegiatan Pendahuluan (Memahami)'],['inti','Kegiatan Inti (Mengaplikasikan)'],['penutup','Kegiatan Penutup (Merefleksi)'],
  ['asesmen','Asesmen (Diagnostik, Formatif, Sumatif)'],['remedial','Remedial'],['pengayaan','Pengayaan'],['sumber','Sumber Belajar & Media']];
  return kop('Modul Ajar per Bab')+cards('modul','Modul',f)+'';
}
function pgBahan(){
  const f=[['judul','Judul Bab','tx'],['ringkasan','Ringkasan Materi'],['isi','Isi / Uraian Materi'],['contoh','Contoh Soal / Kasus'],['latihan','Latihan Soal'],['kunci','Kunci Jawaban']];
  return kop('Bahan Ajar')+cards('bahan','Bab',f);
}
function pgAdmin(){
  const cols=[{k:'nama',l:'Dokumen / Kegiatan',t:'tx'},{k:'status',l:'Status',t:'sel',o:['','Belum','Proses','Selesai']},{k:'catatan',l:'Catatan',t:'ta'}];
  const init=['Data siswa (buku induk)','Daftar hadir siswa','Daftar nilai & leger','Catatan sikap & keaktifan','Buku penghubung orang tua','Rekap pembinaan siswa','Komunikasi / rapat dengan orang tua','Berkas kenaikan kelas / kelulusan','Pengumpulan administrasi kepada kepala sekolah'].map(n=>({nama:n,status:'',catatan:''}));
  return P('Administrasi Wali Kelas', tbl('admin',cols,{blank:{nama:'',status:'',catatan:''},init}));
}
function pgAnalisis(){
  const S=DB.siswa||[];
  const a=S.map((s,i)=>rata(i)).filter(v=>v!=='').map(Number);
  const n=a.length;
  const mean=n?(a.reduce((x,y)=>x+y,0)/n).toFixed(1):'-';
  const max=n?Math.max(...a):'-', min=n?Math.min(...a):'-';
  const tun=a.filter(v=>v>=kkm()).length;
  const dist=(DB.kktp||[]).map(r=>`<tr><td>${esc(r.predikat)}</td><td>${a.filter(v=>predikat(String(v))===r.predikat).length}</td></tr>`).join('');
  return P('Analisis Penilaian',
  `<div class="card"><table>
   <tr><th>Jumlah siswa dinilai</th><td>${n}</td></tr>
   <tr><th>Rata-rata kelas</th><td>${mean}</td></tr>
   <tr><th>Nilai tertinggi</th><td>${max}</td></tr>
   <tr><th>Nilai terendah</th><td>${min}</td></tr>
   <tr><th>Batas nilai tuntas</th><td>${kkm()}</td></tr>
   <tr><th>Batas nilai kompeten</th><td>${batasKompeten()}</td></tr>
   <tr><th>Tuntas</th><td>${tun} siswa (${n?Math.round(tun/n*100):0}%)</td></tr>
   <tr><th>Belum tuntas</th><td>${n-tun} siswa</td></tr></table>
   <p class="hint">Dihitung otomatis dari menu Daftar Nilai (rata-rata pengetahuan &amp; keterampilan).</p></div>
   <div class="card"><h3>Sebaran Predikat</h3><table>${dist||'<tr><td>Isi KKTP terlebih dahulu.</td></tr>'}</table></div>
   <div class="card"><h3>Analisis &amp; Tindak Lanjut</h3>
   <textarea data-k="kv" data-c="analisis" style="min-height:160px">${esc(kv('analisis'))}</textarea></div>`);
}
function pgDeep(){
  return P('Panduan Pembelajaran Mendalam (Deep Learning)',
  `<div class="card"><h3>Tiga Landasan</h3>
  <ul><li><b>Berkesadaran (mindful)</b>: siswa hadir secara penuh dan sadar akan tujuan belajarnya.</li>
  <li><b>Bermakna (meaningful)</b>: materi dikaitkan dengan pengalaman dan dunia nyata siswa.</li>
  <li><b>Menggembirakan (joyful)</b>: suasana belajar aman, positif, dan memotivasi.</li></ul></div>
  <div class="card"><h3>Tiga Tahap Kegiatan</h3>
  <ol><li><b>Memahami</b>: pemantik, eksplorasi konsep, dan pertanyaan pembuka.</li>
  <li><b>Mengaplikasikan</b>: siswa menerapkan konsep lewat proyek, praktik, atau kasus.</li>
  <li><b>Merefleksi</b>: siswa dan guru menilai proses serta hasil belajar.</li></ol></div>
  <div class="card"><h3>Peran Guru</h3><ul>
  <li>Berperan sebagai fasilitator yang mengajukan pertanyaan, bukan hanya memberi jawaban.</li>
  <li>Memberi ruang kolaborasi dan umpan balik yang berkelanjutan.</li>
  <li>Menyesuaikan kegiatan dengan kebutuhan dan minat belajar siswa.</li></ul></div>`);
}
function pgHadir(){
  const b=DB.bulanH||BULAN[0];
  const sel=`<div class="card noprint"><label>Bulan: <select onchange="DB.bulanH=this.value;save();render()">${BULAN.map(x=>`<option${x===b?' selected':''}>${x}</option>`).join('')}</select></label></div>`;
  return P('Daftar Hadir Siswa — '+b, sel+hadirGrid('hadir_'+b,31,''));
}
function pgHadirKls(){
  return P('Daftar Hadir Kelas (per Pertemuan)', hadirGrid('hadirkls',16,'P',dateHead()));
}
function pgNilaiLama(){
  const S=DB.siswa||[];
  if(!S.length) return P('Daftar Nilai','<div class="card hint">Isi Data Siswa dulu di menu 16. Data Nilai.</div>');
  const rows=S.map((s,i)=>{
    const n=(DB.nilai||[])[i]||{};
    return `<tr><td>${i+1}</td><td style="white-space:nowrap">${esc(s.nama)}</td>

function pdfBlob(lines){
  const W=842,H=595,M=36,LH=12,FS=9,MAX=165;
  const wrapped=[];
  lines.forEach(L=>{
    const txt=String(L.t??'').replace(/✓/g,'X').replace(/[^\x20-\x7E -ÿ]/g,'?');
    if(!txt.trim()){wrapped.push({t:' ',b:0});return}
    let s=txt;
    while(s.length>MAX){
      let cut=s.lastIndexOf(' ',MAX);if(cut<40)cut=MAX;
      wrapped.push({t:s.slice(0,cut),b:L.b});
      s='    '+s.slice(cut).trimStart();
    }
    wrapped.push({t:s,b:L.b});
  });
  const per=Math.floor((H-2*M)/LH);
  const pages=[];for(let i=0;i<wrapped.length;i+=per)pages.push(wrapped.slice(i,i+per));
  if(!pages.length) pages.push([]);
  const pe=s=>s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  const objs=[
    '<< /Type /Catalog /Pages 2 0 R >>',
    `<< /Type /Pages /Kids [${pages.map((_,j)=>`${5+2*j} 0 R`).join(' ')}] /Count ${pages.length} >>`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'
  ];
  pages.forEach((pg,j)=>{
    let s='BT\n';let y=H-M-FS;
    pg.forEach(L=>{s+=`/${L.b?'F2':'F1'} ${FS} Tf 1 0 0 1 ${M} ${y} Tm (${pe(L.t)}) Tj\n`;y-=LH});
    s+='ET';
    objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+2*j} 0 R >>`);
    objs.push(`<< /Length ${s.length} >>\nstream\n${s}\nendstream`);
  });
  let out='%PDF-1.4\n';const offs=[];
  objs.forEach((o,k)=>{offs.push(out.length);out+=`${k+1} 0 obj\n${o}\nendobj\n`});
  const xref=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
  offs.forEach(o=>{out+=String(o).padStart(10,'0')+' 00000 n \n'});
  out+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([Uint8Array.from(out,c=>c.charCodeAt(0)&0xFF)],{type:'application/pdf'});
}

function download(blob,name){

}
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){ // tanpa kompresi (metode 0), cukup untuk xlsx/docx
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  files.forEach(f=>{
    const nb=enc.encode(f.name),d=f.data,crc=crc32(d);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,d.length,true);
    lh.setUint32(22,d.length,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nb,d);

    ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,nb.length,true);
    ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);
    ch.setUint32(38,0,true);ch.setUint32(42,off,true);

async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder(),out={};
  let e=-1;for(let i=u8.length-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0) throw new Error('bukan zip');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  for(let k=0;k<n;k++){
    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    const lo=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    const lnl=dv.getUint16(lo+26,true),lxl=dv.getUint16(lo+28,true);
    const start=lo+30+lnl+lxl;const data=u8.subarray(start,start+csz);
    let bytes=data;
    if(method===8){
      const r=new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')));
      bytes=new Uint8Array(await r.arrayBuffer());
    }
    out[name]=bytes;p+=46+nl+xl+cl;
  }
  return out;
}
function xlsxBlob(sheets){

    if(v===''||v==null) return '';

  };

    {name:'_rels/.rels',data:enc.encode(H+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`)},
    {name:'xl/workbook.xml',data:enc.encode(H+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${S.map((s,i)=>`<sheet name="${esc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`)},
    {name:'xl/_rels/workbook.xml.rels',data:enc.encode(H+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${S.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}</Relationships>`)}
  ];

}

function parseCSV(text){
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim()!=='');
  const d=((lines[0]||'').split(';').length>(lines[0]||'').split(',').length)?';':',';
  return lines.map(l=>{
    const out=[];let cur='',q=false;
    for(let i=0;i<l.length;i++){
      const ch=l[i];
      if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
      else if(ch==='"') q=true;
      else if(ch===d){out.push(cur);cur=''}
      else cur+=ch;
    }
    out.push(cur);return out;
  });
}
async function readXlsxRows(buf){
  const z=await unzip(buf),dec=new TextDecoder(),strs=[];
  if(z['xl/sharedStrings.xml']){
    const sd=new DOMParser().parseFromString(dec.decode(z['xl/sharedStrings.xml']),'application/xml');
    Array.from(sd.getElementsByTagName('si')).forEach(si=>strs.push(Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join('')));
  }
  const sheet=z['xl/worksheets/sheet1.xml']||Object.keys(z).filter(n=>n.startsWith('xl/worksheets/')).map(n=>z[n])[0];
  if(!sheet) throw new Error('tidak ada sheet');
  const sd=new DOMParser().parseFromString(dec.decode(sheet),'application/xml');
  const rows=[];
  Array.from(sd.getElementsByTagName('c')).forEach(c=>{
    const m=(c.getAttribute('r')||'').match(/^([A-Z]+)(\d+)$/);if(!m) return;
    let ci=0;for(const ch of m[1]) ci=ci*26+(ch.charCodeAt(0)-64);ci--;
    const ri=+m[2]-1,t=c.getAttribute('t');let v='';
    if(t==='s'){const x=c.getElementsByTagName('v')[0];v=strs[+(x?x.textContent:0)]??''}
    else if(t==='inlineStr'){v=Array.from(c.getElementsByTagName('t')).map(x=>x.textContent).join('')}
    else{const x=c.getElementsByTagName('v')[0];v=x?x.textContent:''}
    rows[ri]=rows[ri]||[];rows[ri][ci]=v;
  });
  return Array.from(rows,r=>r?Array.from(r,x=>x??''):[]);
}
async function impSiswa(inp){
  const f=inp.files[0];if(!f) return;
  let rows;
  try{
    rows=/\.csv$/i.test(f.name)?parseCSV(await f.text()):await readXlsxRows(await f.arrayBuffer());
  }catch(e){alert('File tidak bisa dibaca. Pastikan formatnya .xlsx atau .csv.');return}
  const h=(rows[0]||[]).map(x=>String(x).toLowerCase().trim());
  const iNis=h.findIndex(x=>x==='nis'||x==='nisn');
  const iNama=h.findIndex(x=>x.includes('nama'));
  const iJk=h.findIndex(x=>x==='l/p'||x==='jk'||x.includes('kelamin'));
  if(iNama<0){alert('Kolom "Nama" tidak ditemukan di baris pertama.');return}
  const list=rows.slice(1).filter(r=>String(r[iNama]||'').trim()!=='').map(r=>({
    nis:iNis>=0?String(r[iNis]||'').trim():'',
    nama:String(r[iNama]).trim(),
    jk:iJk>=0&&String(r[iJk]||'').trim().toUpperCase().startsWith('P')?'P':'L'
  }));
  if(!list.length){alert('Tidak ada data siswa yang terbaca.');return}
  if(!confirm(`Ganti daftar siswa dengan ${list.length} siswa dari file ini?`)) return;
  DB.siswa=list;save();render();
}

    {name:'_rels/.rels',data:enc.encode(H+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`)},
    {name:'word/document.xml',data:enc.encode(H+`<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr/></w:body></w:document>`)}
  ]);
}
function docxItem(key,i){

 {min:0,predikat:'D (Perlu Bimbingan)',desc:'Belum menguasai tujuan pembelajaran, perlu bimbingan dan remedial.'}
];
function seedProfile(c){
  const x=clone(SEED[c.startsWith('XI ')?'XI':'XII']);
  return {
    id:{mapel:'Kreativitas, Inovasi dan Kewirausahaan (KIK)',kelas:c,konsentrasi:'Teknik Jaringan Komputer dan Telekomunikasi (TJKT)',semester:'Ganjil',tahun:'2026/2027',kkmTuntas:'87',batasKompeten:'95'},
    atp:x.atp,cptp:x.cptp,prota:x.prota,promes:x.promes,modul:x.modul,kktp:clone(KKTP_SEED)
  };
}

/* ---------- muat data & mulai ---------- */
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.profiles)STORE=s}catch(e){}
CLASSES.forEach(c=>{if(!STORE.profiles[c])STORE.profiles[c]=seedProfile(c)});
Object.values(STORE.profiles).forEach(p=>{
  p.id=p.id||{};
  if(p.id.kkmTuntas===undefined) p.id.kkmTuntas='87';
  if(p.id.batasKompeten===undefined) p.id.batasKompeten='95';
});
if(!STORE.profiles[STORE.active])STORE.active=CLASSES[0];
DB=STORE.profiles[STORE.active];
/* tanggal tampil sebagai teks saat dicetak */
function tglText(v){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');return m?`${m[3]}-${m[2]}-${m[1]}`:''}
window.addEventListener('beforeprint',()=>{
  document.querySelectorAll('input[type=date]').forEach(el=>{
    let s=el.nextElementSibling;
    if(!s||!s.classList.contains('pv')){s=document.createElement('span');s.className='pv';el.after(s)}
    s.textContent=tglText(el.value);
  });
});
render();
</script>
